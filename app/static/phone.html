<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VINGAGE · Phone camera</title>
<link rel="stylesheet" href="/static/css/app.css"><style>
body{background:#100e0b;color:#f2ede3;min-height:100vh;display:flex;flex-direction:column}
.p{flex:1;display:flex;flex-direction:column;padding:22px;gap:18px;max-width:560px;margin:0 auto;width:100%}
video{width:100%;aspect-ratio:3/4;object-fit:cover;background:#1a1713;border-radius:6px;display:block}
.say2{font:400 44px/1 var(--serif)}.say2 em{color:#ff6a45}.m{color:#8f8676;font-size:14px}
.btn{color:#f2ede3;border-color:#3b362b;width:100%;justify-content:center;padding:18px}.btn.pri{background:#ff6a45;border-color:#ff6a45;color:#100e0b}
</style></head><body><div class="p">
<a class="word" href="#" style="color:#f2ede3">VINGAGE<i></i></a>
<div><div class="say2" id="h">Use this phone as the <em>room camera.</em></div><p class="m" id="m" style="margin-top:10px">Point it at the audience. Only the camera image is sent to your laptop, on your own Wi-Fi. Nothing is stored.</p></div>
<video id="v" playsinline muted hidden></video>
<button class="btn pri" id="go">Start camera</button><button class="btn" id="flip" hidden>Switch front / back camera</button>
<div class="lbl" id="st" style="color:#8f8676"></div></div>
<script>
(function(){const $=id=>document.getElementById(id),tk=new URLSearchParams(location.search).get('t')||'';let ws,stream,face='environment',timer,wl,sent=0,t0=Date.now();
 const cv=document.createElement('canvas'),cx=cv.getContext('2d');
 async function cam(){if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:face,width:{ideal:1280},height:{ideal:720}},audio:false});const v=$('v');v.srcObject=stream;await v.play();v.hidden=false}
 function link(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/phone?t='+encodeURIComponent(tk));ws.binaryType='arraybuffer';
  ws.onopen=()=>{$('st').textContent='Streaming to the laptop';$('h').innerHTML='Streaming. <em>Keep this open.</em>';$('m').textContent='Lock the phone in place facing the audience. The screen is kept awake.'};
  ws.onclose=()=>{$('st').textContent='Disconnected. Retrying\u2026';setTimeout(link,1500)}}
 function loop(){timer=setInterval(()=>{const v=$('v');if(!ws||ws.readyState!==1||ws.bufferedAmount>300000||!v.videoWidth)return;
  const w=640,h=Math.round(w*v.videoHeight/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);cv.toBlob(b=>{if(b&&ws.readyState===1){ws.send(b);sent++}},'image/jpeg',.6)},80)}
 $('go').onclick=async()=>{try{await cam();$('go').hidden=true;$('flip').hidden=false;link();loop();try{wl=await navigator.wakeLock.request('screen')}catch(e){}}catch(e){$('st').textContent='Camera blocked: allow camera access for this page ('+e.name+')'}};
 $('flip').onclick=async()=>{face=face==='environment'?'user':'environment';try{await cam()}catch(e){}};
 if(!tk)$('st').textContent='Open this page from the QR code on the Setup screen.';
})();
</script></body></html>
